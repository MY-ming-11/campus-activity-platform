server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: activity-platform

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:activity_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  jackson:
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# 手写 JWT 的配置：密钥和有效期
jwt:
  secret: ${JWT_SECRET:local-dev-secret-please-change-me-32bytes}
  expire-minutes: 1440

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

logging:
  level:
    # 默认 info。本地要排查 SQL 时用 LOG_LEVEL=debug 启动。
    # 默认开 debug 的话，容器日志会被消息表每 200ms 一次的轮询刷满，真正有用的日志全被埋了。
    com.luosh.activity: ${LOG_LEVEL:info}
