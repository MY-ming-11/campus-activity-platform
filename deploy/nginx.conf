server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 打包出来的文件名带 hash，内容变了文件名就变，可以放心长期缓存
    location /assets/ {
        # 只用 add_header 一条，不要同时写 expires——
        # expires 会自动再加一条 Cache-Control: max-age=...，响应头里会出现两个 Cache-Control
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 前端是单页应用，直接访问 /activities/6 时服务器上没有这个文件，
    # 必须回退到 index.html 交给前端路由处理，否则刷新页面就是 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口转发到后端容器。前端代码里写的是相对路径 /api/xxx，
    # 开发环境由 Vite 代理，生产环境由这里代理，两边写法一致。
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
