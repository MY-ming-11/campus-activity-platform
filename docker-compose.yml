# 一键起整套服务：Nginx（前端）+ 后端 + MySQL + Redis
# 启动：docker compose up -d --build
# 访问：http://localhost        （前端）
#       http://localhost:8080/swagger-ui.html （接口文档）
# 日志：docker compose logs -f backend

# 显式指定项目名。不写的话 Compose 会拿目录名当项目名，
# 而本项目目录名是中文，推导不出合法项目名（只允许小写字母、数字、下划线、连字符）。
name: activity-platform

services:

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ap-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 宿主机端口可覆盖：80 被占用时用 WEB_PORT=8000 docker compose up -d
      - "${WEB_PORT:-80}:80"

  mysql:
    image: mysql:8.0
    container_name: ap-mysql
    restart: unless-stopped
    # 刻意不映射 3306 到宿主机：
    # 后端通过 compose 内部网络直连 mysql:3306，数据库没必要对外开端口。
    # 要连库排查时用：docker compose exec mysql mysql -uroot -p
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: activity_platform
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 只挂建表脚本。不能挂整个 sql 目录，否则 MySQL 会按字母序执行目录下所有 .sql，
      # cleanup-benchmark.sql 排在 schema.sql 前面，建表还没跑就去删表，容器直接起不来。
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ap-redis
    restart: unless-stopped
    # 同样不映射 6379，理由同上
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ap-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: activity_platform
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: change-this-to-a-random-string-at-least-32-bytes
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
